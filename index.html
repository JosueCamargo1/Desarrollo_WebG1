<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidad II · Formularios avanzados</title>
    <!-- Font Awesome 6 (gratuito) para iconos -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Estilos CSS personalizados -->
    <link rel="stylesheet" href="login.css" />
</head>
  <body>
    <form id="loginForm" novalidate>
        <h1>Iniciar Sesion</h1>

        <div class="form-group">
             <label for="LoginEmail">Correo Electronico</label>
             <input
             type="email" 
             id="loginEmail"
             name="email"
             required
             placeholder="correo@unicaribe.edu.co"/> 
            <span class="error-message" id="emailError"></span>
        </div>           

        <div class="form-group">
            <label for="loginPass"></label>
            <input
            type="password" 
            id="loginPass"
            name="password"
            required
            minlength="6"
            placeholder="**********"/>
            <span class="error-massage" id="passError"></span>
        </div>

        <button type="submit" class="btn-primary">Iniciar Sesion</button>

    </form>

        <div id="loginWelcome" class="welcome-card" style="display: none;">
            <h2>Bienvenido</h2>
            <p>Has iniciado correctamente</p>
            <p>Correo: <span id="userEmailDisplaty"></span></p>
        </div>

   </body>

  <script src="login.js"></script>

</html>
